  <!-- SEO Fix: Aggressively Remove Figma Make noindex -->
  <script>
    (function() {
      'use strict';
      
      console.log('🔍 SEO Guard: Initializing anti-noindex protection...');
      
      // 1. Immediate cleanup function
      function cleanRobots() {
        const metaTags = document.querySelectorAll('meta[name="robots"], meta[name="googlebot"], meta[name="bingbot"]');
        let hasIndexRobots = false;
        let hasIndexGooglebot = false;
        let hasIndexBingbot = false;
        
        metaTags.forEach(tag => {
          const name = tag.getAttribute('name');
          const content = tag.getAttribute('content') || '';
          
          if (content.includes('noindex') || content.includes('none')) {
            tag.remove();
            console.log(`🚫 SEO Guard: Removed ${name} with noindex:`, content);
          } else {
            if (name === 'robots' && content.includes('index')) hasIndexRobots = true;
            if (name === 'googlebot' && content.includes('index')) hasIndexGooglebot = true;
            if (name === 'bingbot' && content.includes('index')) hasIndexBingbot = true;
          }
        });
        
        // Ensure we have proper index tags
        if (!hasIndexRobots) {
          const meta = document.createElement('meta');
          meta.setAttribute('name', 'robots');
          meta.setAttribute('content', 'index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1');
          meta.setAttribute('data-seo-guard', 'true');
          document.head.appendChild(meta);
          console.log('✅ SEO Guard: Added robots index tag');
        }
        
        if (!hasIndexGooglebot) {
          const meta = document.createElement('meta');
          meta.setAttribute('name', 'googlebot');
          meta.setAttribute('content', 'index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1');
          meta.setAttribute('data-seo-guard', 'true');
          document.head.appendChild(meta);
          console.log('✅ SEO Guard: Added googlebot index tag');
        }
        
        if (!hasIndexBingbot) {
          const meta = document.createElement('meta');
          meta.setAttribute('name', 'bingbot');
          meta.setAttribute('content', 'index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1');
          meta.setAttribute('data-seo-guard', 'true');
          document.head.appendChild(meta);
          console.log('✅ SEO Guard: Added bingbot index tag');
        }
      }
      
      // 2. Run immediately
      cleanRobots();
      
      // 3. Run on DOMContentLoaded
      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', cleanRobots);
      }
      
      // 4. Watch for DOM changes with MutationObserver
      const observer = new MutationObserver((mutations) => {
        mutations.forEach((mutation) => {
          mutation.addedNodes.forEach((node) => {
            if (node.nodeName === 'META') {
              const name = node.getAttribute('name');
              const content = node.getAttribute('content') || '';
              
              if ((name === 'robots' || name === 'googlebot' || name === 'bingbot') && 
                  (content.includes('noindex') || content.includes('none'))) {
                node.remove();
                console.log(`🚫 SEO Guard: Blocked dynamic ${name} noindex insertion`);
                cleanRobots(); // Re-add index tags if needed
              }
            }
          });
          
          mutation.removedNodes.forEach((node) => {
            if (node.nodeName === 'META' && node.hasAttribute('data-seo-guard')) {
              console.log('⚠️ SEO Guard: Index tag was removed, restoring...');
              setTimeout(cleanRobots, 0);
            }
          });
        });
      });
      
      observer.observe(document.head, { 
        childList: true, 
        subtree: true,
        attributes: true,
        attributeFilter: ['content']
      });
      
      // 5. Periodic check every 2 seconds (fallback)
      setInterval(cleanRobots, 2000);
      
      // 6. Check before page unload
      window.addEventListener('beforeunload', cleanRobots);
      
      console.log('✅ SEO Guard: Protection active');
    })();
  </script>
